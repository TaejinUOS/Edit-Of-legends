<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <main class="panel">
      <header class="topbar">
        <div class="brand">
          <div class="mark" aria-hidden="true">E<span>/</span>L</div>
          <div class="title-block">
            <h1>EditOfLegends</h1>
            <p>하이라이트 러프컷</p>
          </div>
        </div>
        <span id="health" class="status offline"><i></i>연결 안 됨</span>
      </header>

      <section class="card source-card" aria-labelledby="source-title">
        <div class="section-title compact-title">
          <h2 id="source-title"><span>01</span> 원본 클립</h2>
          <button id="source" class="secondary small">선택 클립 불러오기</button>
        </div>
        <div id="source-info" class="source-info empty">
          타임라인에서 영상 클립 하나를 선택하세요.
        </div>
      </section>

      <section class="card" aria-labelledby="analysis-title">
        <div class="section-title">
          <h2 id="analysis-title"><span>02</span> 분석</h2>
        </div>
        <div class="field-grid three timing-grid">
          <label>이전 <small>초</small><input id="before" type="number" value="11" min="0" max="120" /></label>
          <label>이후 <small>초</small><input id="after" type="number" value="7" min="0" max="120" /></label>
          <label>동시 판정 <small>초</small><input id="gap" type="number" value="15" min="0" max="60" /></label>
        </div>
        <fieldset class="event-types">
          <legend>포함할 이벤트</legend>
          <label><input id="kill" type="checkbox" checked /><span class="track v1">V1</span> 킬</label>
          <label><input id="assist" type="checkbox" checked /><span class="track v2">V2</span> 어시</label>
          <label><input id="death" type="checkbox" checked /><span class="track v3">V3</span> 데스</label>
        </fieldset>
        <div class="action-row">
          <button id="analyze" class="primary grow">녹화본 분석</button>
          <button id="cancel" class="secondary cancel-button">취소</button>
        </div>
        <div id="progress-wrap" class="progress-wrap hidden" aria-live="polite">
          <div class="progress-line">
            <span id="progress-label">준비 중</span><span id="progress-percent">0%</span>
          </div>
          <div class="progress-track"><div id="progress-bar"></div></div>
        </div>
      </section>

      <section class="card" aria-labelledby="output-title">
        <div class="section-title">
          <h2 id="output-title"><span>03</span> 결과 및 생성</h2>
        </div>
        <div class="job-row">
          <select id="jobs" aria-label="완료된 분석">
            <option value="">완료된 작업 없음</option>
          </select>
          <button id="refresh" class="secondary icon-button" title="새로고침" aria-label="새로고침">↻</button>
          <button id="load-job" class="secondary small">불러오기</button>
        </div>
        <p id="summary" class="summary">분석 결과를 불러오면 이벤트가 여기에 표시됩니다.</p>
        <div id="events" aria-live="polite"></div>
        <button id="generate" class="primary full">새 시퀀스 생성</button>
      </section>

      <p id="message" class="message" role="status" aria-live="polite">
        엔진에 연결하면 시작할 수 있습니다.
      </p>

      <section class="settings-card" aria-label="기타 설정">
        <button id="settings-toggle" class="settings-toggle" aria-expanded="false" aria-controls="advanced-settings">
          <span>기타 설정</span><span id="settings-arrow" aria-hidden="true">▸</span>
        </button>
        <div id="advanced-settings" class="advanced-settings hidden">
          <div class="setting-block">
            <div class="setting-heading">
              <strong>로컬 엔진</strong><span class="hint-inline">자동 연결</span>
            </div>
            <button id="connect" class="secondary full">연결 파일 선택</button>
          </div>
          <div class="setting-block worker-row">
            <label for="workers">분석 워커</label>
            <select id="workers">
              <option value="auto">자동</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="4">4</option>
              <option value="8" selected>8</option>
            </select>
          </div>
          <div class="setting-block hud-block">
            <div class="setting-heading">
              <strong>HUD 영역 <small>화면 비율 %</small></strong>
              <button id="review" class="text-button">검토 화면 열기 ↗</button>
            </div>
            <div class="field-grid four roi">
              <label>X<input id="x" value="86.7" type="number" min="0" max="100" step="0.1" /></label>
              <label>Y<input id="y" value="0.1" type="number" min="0" max="100" step="0.1" /></label>
              <label>너비<input id="width" value="3.9" type="number" min="0.1" max="100" step="0.1" /></label>
              <label>높이<input id="height" value="2.2" type="number" min="0.1" max="100" step="0.1" /></label>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script src="panel.js"></script>
  </body>
</html>
